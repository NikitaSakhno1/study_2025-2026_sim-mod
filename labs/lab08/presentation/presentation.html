<title>Лабораторная работа №8 — Имитационное моделирование</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #111; overflow: hidden;
    font-family: Arial, sans-serif;
  }
  .deck {
    width: 100vw; height: 100vh;
    position: relative;
  }
  .slide {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: #111;
  }
  .slide.active { display: flex; }
  .slide img {
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    object-fit: contain;
    user-select: none;
  }
  .counter {
    position: fixed;
    right: 18px;
    bottom: 14px;
    z-index: 10;
    color: rgba(255,255,255,.75);
    background: rgba(0,0,0,.45);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 14px;
  }
  .hint {
    position: fixed;
    left: 18px;
    bottom: 14px;
    z-index: 10;
    color: rgba(255,255,255,.55);
    background: rgba(0,0,0,.35);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 13px;
    transition: opacity .5s;
  }
  .controls {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9;
  }
  button {
    pointer-events: auto;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px; height: 72px;
    border: 0;
    border-radius: 10px;
    background: rgba(0,0,0,.28);
    color: white;
    font-size: 36px;
    cursor: pointer;
    opacity: .25;
  }
  button:hover { opacity: .8; }
  #prev { left: 12px; }
  #next { right: 12px; }
  @media (max-width: 700px) {
    button { width: 40px; height: 60px; font-size: 28px; }
    .hint { display: none; }
  }
</style>

<div class="controls">
  <button id="prev" aria-label="Предыдущий слайд">‹</button>
  <button id="next" aria-label="Следующий слайд">›</button>
</div>
<div class="counter" id="counter">1 / 10</div>
<div class="hint" id="hint">← → или пробел — переключение слайдов • F — полноэкранный режим</div>

<script>
const slides = [...document.querySelectorAll('.slide')];
let current = 0;

function show(n) {
  current = Math.max(0, Math.min(slides.length - 1, n));
  slides.forEach((s, i) => s.classList.toggle('active', i === current));
  document.getElementById('counter').textContent = `${current + 1} / ${slides.length}`;
}

function next() { show(current + 1); }
function prev() { show(current - 1); }

document.getElementById('next').addEventListener('click', next);
document.getElementById('prev').addEventListener('click', prev);

document.addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) {
    e.preventDefault(); next();
  } else if (['ArrowLeft', 'PageUp'].includes(e.key)) {
    e.preventDefault(); prev();
  } else if (e.key === 'Home') {
    show(0);
  } else if (e.key === 'End') {
    show(slides.length - 1);
  } else if (e.key.toLowerCase() === 'f') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
});

let touchStartX = null;
document.addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].screenX;
}, {passive: true});
document.addEventListener('touchend', e => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(dx) > 50) dx < 0 ? next() : prev();
  touchStartX = null;
}, {passive: true});

show(0);
setTimeout(() => {
  const h = document.getElementById('hint');
  if (h) h.style.opacity = '0';
}, 5000);
</script>
